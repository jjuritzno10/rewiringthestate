<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewiring the State</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<script>
(function () {
  try {
    var stored = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', stored || 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root,
:root[data-theme="dark"] {
  --bg:     #0A0A0A;
  --fg:     #F5F5F5;
  --fg-rgb: 245,245,245;
  --noise-opacity: 0.016;
}

:root[data-theme="light"] {
  --bg:     #F2EEE5;
  --fg:     #0A0A0A;
  --fg-rgb: 10,10,10;
  --noise-opacity: 0.035;
}

:root {
  --mid:    rgba(var(--fg-rgb), 0.55);
  --dim:    rgba(var(--fg-rgb), 0.42);
  --b0:     rgba(var(--fg-rgb), 0.10);
  --b1:     rgba(var(--fg-rgb), 0.18);
  --b2:     rgba(var(--fg-rgb), 0.55);
  --serif:  'EB Garamond', 'Times New Roman', Georgia, serif;
  --mono:   'JetBrains Mono', 'Courier New', monospace;
}

:root[data-theme="dark"] {
  --mid:    rgba(var(--fg-rgb), 0.45);
  --dim:    rgba(var(--fg-rgb), 0.28);
  --b0:     rgba(var(--fg-rgb), 0.08);
  --b1:     rgba(var(--fg-rgb), 0.14);
  --b2:     rgba(var(--fg-rgb), 0.50);
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: var(--noise-opacity);
  mix-blend-mode: difference;
}

.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex; flex-direction: column;
  padding: clamp(2.5rem,6vw,5rem) clamp(1.5rem,5vw,4.5rem);
  gap: clamp(2.5rem,6vw,5rem);
}

.hero { display: flex; flex-direction: column; }

.eyebrow {
  font-size: clamp(0.58rem,1.1vw,0.68rem);
  font-weight: 300;
  letter-spacing: 0.32em;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 1.6rem;
  opacity: 0;
  animation: up 0.7s ease forwards 0.15s;
}

h1 {
  font-family: var(--serif);
  font-size: clamp(4rem,9.5vw,10rem);
  font-weight: 400;
  line-height: 0.9;
  letter-spacing: -0.015em;
  color: var(--fg);
  opacity: 0;
  animation: up 0.9s ease forwards 0.35s;
}
h1 em { font-style: italic; }

.tagline {
  font-family: var(--serif);
  font-size: clamp(1.4rem,2.2vw,1.75rem);
  font-weight: 500;
  font-style: normal;
  line-height: 1.4;
  letter-spacing: 0.005em;
  color: var(--mid);
  margin-top: clamp(1.25rem,2.2vw,1.75rem);
  /* max-width: 38ch; */
  opacity: 0;
  animation: up 0.8s ease forwards 0.6s;
}

.rule {
  margin-top: clamp(1.8rem,4vw,3rem);
  height: 1px;
  background: var(--b1);
  opacity: 0;
  animation: fade 0.7s ease forwards 0.85s;
}

.section-row {
  display: flex; align-items: center; gap: 1.5rem;
  opacity: 0;
  animation: up 0.6s ease forwards 1.05s;
}
.section-label {
  font-size: clamp(0.55rem,1vw,0.65rem);
  font-weight: 300;
  letter-spacing: 0.32em;
  color: var(--dim);
  text-transform: uppercase;
  white-space: nowrap;
}
.section-rule { flex: 1; height: 1px; background: var(--b0); }

.roles-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  border-top: 1px solid var(--b1);
  border-left: 1px solid var(--b1);
  opacity: 0;
  animation: up 0.7s ease forwards 1.2s;
}

@media (max-width: 740px) { .roles-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .roles-grid { grid-template-columns: 1fr; } }

.card {
  background: var(--bg);
  padding: clamp(1.3rem,3vw,2rem) clamp(1.2rem,2.5vw,1.75rem);
  display: flex; flex-direction: column; gap: 1rem;
  transition: background 0.2s ease;
  position: relative;
  border-right: 1px solid var(--b1);
  border-bottom: 1px solid var(--b1);
}
.card:hover { background: rgba(var(--fg-rgb), 0.022); }

.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
}
.card[data-unit="justice"]::before { background: rgba(var(--fg-rgb), 0.55); }
.card[data-unit="iai"]::before     { background: rgba(var(--fg-rgb), 0.30); }
.card[data-unit="10if"]::before    { background: rgba(var(--fg-rgb), 0.18); }
.card[data-unit="pm"]::before      { background: rgba(var(--fg-rgb), 0.10); }
.card[data-unit="police"]::before  { background: rgba(var(--fg-rgb), 0.10); }
.card[data-unit="aisi"]::before    { background: rgba(var(--fg-rgb), 0.10); }
.card[data-unit="no10ds"]::before  { background: rgba(var(--fg-rgb), 0.10); }

.card-soon .role-title { color: var(--mid); }
.card-soon .team-desc  { color: rgba(var(--fg-rgb), 0.30); }

.ghost-btn-soon {
  display: inline-block;
  align-self: flex-start;
  margin-top: auto;
  font-family: var(--mono);
  font-size: clamp(0.5rem,0.85vw,0.6rem);
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(var(--fg-rgb), 0.32);
  border: 1px dashed var(--b1);
  padding: 0.5em 1em;
  background: transparent;
}

.role-title {
  font-family: var(--serif);
  font-size: clamp(1.3rem,2.8vw,1.9rem);
  font-weight: 400;
  line-height: 1.1;
  color: var(--fg);
}

.team-name {
  font-family: var(--serif);
  font-size: clamp(1rem,2vw,1.3rem);
  font-weight: 400;
  font-style: italic;
  letter-spacing: 0.01em;
  color: var(--mid);
}

.team-desc {
  font-size: clamp(0.65rem,1.1vw,0.73rem);
  font-weight: 300;
  letter-spacing: 0.04em;
  line-height: 1.65;
  color: var(--dim);
  flex: 1;
}

.ghost-btn {
  display: inline-block;
  align-self: flex-start;
  margin-top: auto;
  font-family: var(--mono);
  font-size: clamp(0.5rem,0.85vw,0.6rem);
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--dim);
  border: 1px solid var(--b1);
  padding: 0.5em 1em;
  background: transparent;
  cursor: pointer;
  text-decoration: none;
  transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.ghost-btn:hover {
  color: var(--fg);
  border-color: var(--b2);
  box-shadow: 0 0 14px rgba(var(--fg-rgb), 0.05);
}

.theme-toggle {
  position: fixed;
  top: clamp(1.25rem,2.5vw,1.75rem);
  right: clamp(1.25rem,2.5vw,1.75rem);
  z-index: 10;
  width: 2.4rem;
  height: 2.4rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 0.85rem;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--b1);
  border-radius: 50%;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s, transform 0.4s ease, box-shadow 0.2s;
}
.theme-toggle:hover {
  color: var(--fg);
  border-color: var(--b2);
  box-shadow: 0 0 14px rgba(var(--fg-rgb), 0.06);
  transform: rotate(20deg);
}
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: inline; }
:root[data-theme="light"] .theme-toggle .icon-sun  { display: inline; }
:root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

footer {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--b0);
  opacity: 0;
  animation: fade 0.7s ease forwards 1.7s;
}
.foot-line {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.1rem,2.5vw,1.5rem);
  color: var(--dim);
}
.foot-meta {
  font-size: clamp(0.5rem,0.85vw,0.6rem);
  font-weight: 300;
  letter-spacing: 0.25em;
  color: rgba(var(--fg-rgb), 0.22);
  text-transform: uppercase;
}

.contact {
  margin-top: clamp(2rem,4vw,3rem);
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(0.85rem,1.4vw,1rem);
  color: var(--dim);
  opacity: 0;
  animation: fade 0.7s ease forwards 1.5s;
}
.contact a {
  color: var(--mid);
  text-decoration: none;
  border-bottom: 1px solid var(--b1);
  transition: color 0.2s, border-color 0.2s;
}
.contact a:hover {
  color: var(--fg);
  border-color: var(--b2);
}

@keyframes up   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle colour theme">
  <span class="icon-moon" aria-hidden="true">☾</span>
  <span class="icon-sun" aria-hidden="true">☀</span>
</button>

<div class="page">

  <header class="hero">

    <h1>Rewiring<br><em>the State</em></h1>
    
  </header>
  <p class="tagline">Open roles in the UK government's most ambitious AI teams.</p>

  <div class="section-row">
    <span class="section-label">Open Roles</span>
    <div class="section-rule"></div>
  </div>

  <main class="roles-grid" id="grid"></main>

  <div class="section-row">
    <span class="section-label">Coming Soon</span>
    <div class="section-rule"></div>
  </div>

  <main class="roles-grid" id="upcoming"></main>

  <p class="contact"><a href="mailto:jordan.juritz@ai.gov.uk">Got questions? Contact us</a></p>

  <footer>
    <span class="foot-meta">Unofficial. Curated by builders in the UK Gov.</span>
  </footer>

</div>
<script>
const ROLES = [
  {
    role: "Forward Deployed Engineer",
    unit: "justice",
    team: "Justice AI",
    url: "https://ai.justice.gov.uk/careers",
    desc: "Ship code in the field. Work shoulder-to-shoulder with users in prisons, courts and probation — building from conversation, not spec."
  },
  {
    role: "Platform Engineer",
    unit: "justice",
    team: "Justice AI",
    url: "https://ai.justice.gov.uk/careers",
    desc: "Design and maintain the secure, reliable systems that power AI at scale — pipelines, MLOps, cloud and observability."
  },
  {
    role: "AI Product Manager",
    unit: "justice",
    team: "Justice AI",
    url: "https://ai.justice.gov.uk/careers",
    desc: "Translate user needs and system challenges into AI products that are usable, ethical and impactful across the justice system."
  },
  {
    role: "Applied AI Engineer",
    unit: "iai",
    team: "i.AI",
    url: "https://ai.gov.uk/opportunities/",
    desc: "Rapidly designing, testing and deploying AI products that cut across the whole of government."
  },
  {
    role: "Head of Applied AI",
    unit: "iai",
    team: "i.AI",
    url: "https://ai.gov.uk/opportunities/",
    desc: "Lead the engineers shipping frontier AI into government — set the technical bar and the products that follow."
  },
  {
    role: "Fellow",
    unit: "10if",
    team: "No10 Fellowship",
    url: "https://fellows.ai.gov.uk/",
    desc: "A high-impact tour of duty deploying world-class technical talent on PM-priority problems."
  }
];

const UPCOMING = [
  {
    team: "PM's Office",
    unit: "pm",
    desc: "Technical talent embedded at the centre — building tools for the Prime Minister's priorities."
  },
  {
    team: "Police AI Lab",
    unit: "police",
    desc: "Building and deploying AI across UK policing — from frontline tools to force-wide platforms."
  },
  {
    team: "AISI",
    unit: "aisi",
    desc: "The AI Safety Institute — evaluating frontier models and advancing the science of safe AI."
  },
  {
    team: "No10 Data Science",
    unit: "no10ds",
    desc: "Data scientists at the centre of government — turning data into insight for the Prime Minister's priorities."
  }
];

document.getElementById('grid').innerHTML = ROLES.map(r => `
  <div class="card" data-unit="${r.unit}">
    <p class="role-title">${r.role}</p>
    <p class="team-name">${r.team}</p>
    <p class="team-desc">${r.desc}</p>
    <a class="ghost-btn" href="${r.url}" target="_blank" rel="noopener">Apply &rarr;</a>
  </div>
`).join('');

document.getElementById('upcoming').innerHTML = UPCOMING.map(r => `
  <div class="card card-soon" data-unit="${r.unit}">
    <p class="role-title">${r.team}</p>
    <p class="team-desc">${r.desc}</p>
    <span class="ghost-btn-soon">Coming soon</span>
  </div>
`).join('');

document.getElementById('themeToggle').addEventListener('click', () => {
  const root = document.documentElement;
  const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
});
</script>
</body>
</html>
